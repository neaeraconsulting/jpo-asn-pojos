name: Publish JARs to the Maven Central Repository
on:
  release:
    types:
      - published

jobs:
  publish:
    # Only publish for Neaera on actual releases, not pre-releases (see the snapshot workflow for pre-releases)
    if: ${{ github.repository == 'neaeraconsulting/jpo-asn-pojos' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish package (runtime)
        run: mvn -P release --batch-mode deploy --projects :jpo-asn-runtime
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Publish package (pojos)
        run: mvn -P release --batch-mode deploy --projects :jpo-asn-j2735-2024
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Upload build artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-release-artifacts
          path: |
            jpo-asn-runtime/target
            jpo-asn-j2735-2024/target
          retention-days: 7